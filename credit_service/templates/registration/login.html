{% extends "base.html" %}
{% block title %}Log in - Credit Service{% endblock %}
{% block content %}
<div class="login-wrapper card">
    <h1>Sign in</h1>
    <p class="subtitle">Access the cooperative credit desk.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Log in</button>
    </form>
</div>
{% endblock %}
