{% extends "base.html" %}
{% block title %}New Loan Inquiry{% endblock %}
{% block content %}
<h1>New Loan Inquiry</h1>
<p class="subtitle">Log an initial member inquiry before a formal application.</p>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save Inquiry</button>
    </form>
</div>
{% endblock %}
