{% extends "base.html" %}
{% block title %}Payment Option{% endblock %}
{% block content %}
<h1>Select Payment Option</h1>
<p class="subtitle">Application #{{ application.id }} &middot; {{ application.member }}</p>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save Option</button>
    </form>
</div>
<p><a href="{% url 'loans:application-detail' application.pk %}">&larr; Back to application</a></p>
{% endblock %}
