<script>
(function () {
  function initAdminLogoutConfirm() {
    const logoutBtn = document.getElementById('logoutBtn');
    const logoutForm = document.getElementById('logoutForm');
    if (!logoutBtn || !logoutForm) return;

    logoutBtn.addEventListener('click', function (e) {
      e.preventDefault();
      showLogoutConfirmModal();
    });

    function showLogoutConfirmModal() {
      const modal = document.getElementById('logoutConfirmModal');
      if (!modal) {
        if (confirm('Are you sure you want to logout?')) logoutForm.submit();
        return;
      }
      if (typeof bootstrap === 'undefined') {
        if (confirm('Are you sure you want to logout?')) logoutForm.submit();
        return;
      }

      let bsModal = bootstrap.Modal.getInstance(modal);
      if (!bsModal) {
        bsModal = new bootstrap.Modal(modal, { backdrop: true, keyboard: true, focus: true });
      }

      const confirmBtn = modal.querySelector('.btn-confirm');
      const cancelBtn = modal.querySelector('.btn-cancel');

      if (confirmBtn) {
        const newConfirmBtn = confirmBtn.cloneNode(true);
        confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
        newConfirmBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          bsModal.hide();
          setTimeout(function () { logoutForm.submit(); }, 300);
        });
      }

      if (cancelBtn) {
        const newCancelBtn = cancelBtn.cloneNode(true);
        cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);
        newCancelBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          bsModal.hide();
        });
      }

      try {
        bsModal.show();
      } catch (err) {
        if (confirm('Are you sure you want to logout?')) logoutForm.submit();
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAdminLogoutConfirm);
  } else {
    initAdminLogoutConfirm();
  }
})();
</script>
