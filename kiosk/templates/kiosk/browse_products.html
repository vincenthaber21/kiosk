<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse products — {{ kiosk_config.system_name }}</title>
    {% include "partials/bootstrap_head.html" %}
    {% include "partials/inter_font.html" %}
    <style>
:root {
            --brand: #ED1C24;
            --accent: #E6C200;
            --brand-light: #FF4D54;
            --muted: #6c757d;
            --inv-border: #e2e8f0;
            --radius: 16px;
            --radius-sm: 12px;
            --shadow-sm: 0 2px 8px rgba(16,24,40,0.06);
            --shadow-md: 0 4px 20px rgba(16,24,40,0.1);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; }
        html { height: 100%; }
        html, body { margin: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(165deg, #FEF7D5 0%, #FFFDE7 45%, #f8fafc 100%);
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
        }
        .bp-topbar {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark, #C4121A) 100%);
            color: #fff;
            padding: 10px clamp(12px, 2vw, 28px);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }
        .bp-topbar-inner {
            width: 100%;
            max-width: none;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .bp-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            transition: var(--transition);
        }
        .bp-back:hover { background: rgba(255,255,255,0.28); color: #fff; }
        .bp-title-block { flex: 1; min-width: 160px; }
        .bp-title-block h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .bp-title-block p { margin: 2px 0 0; opacity: 0.9; font-size: 0.82rem; }
        .bp-member-pill {
            font-size: 0.8rem;
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 999px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .bp-member-remove {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
            line-height: 1;
        }
        .bp-member-remove:hover { background: rgba(255,255,255,0.55); }
        .bp-main {
            flex: 1 1 0;
            min-height: 0;
            max-width: none;
            margin: 0;
            width: 100%;
            padding: 8px clamp(12px, 2vw, 28px) 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .bp-toolbar {
            background: #fff;
            border-radius: 20px;
            padding: 10px 12px 10px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        /* Match dashboard /inventory “All Products” filter row */
        .bp-inv-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: -0.02em;
        }
        .bp-inv-row {
            gap: 6px !important;
        }
        @media (min-width: 576px) {
            .bp-inv-row { gap: 8px !important; }
        }
        .bp-inv-icon-left {
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            pointer-events: none;
            font-size: 0.95rem;
        }
        .bp-inv-filter-wrap {
            min-width: 160px;
            flex: 0 1 200px;
        }
        .bp-inv-search-wrap {
            min-width: 0;
            flex: 1 1 180px;
        }
        @media (max-width: 575px) {
            .bp-inv-filter-wrap,
            .bp-inv-search-wrap {
                flex: 1 1 100%;
            }
        }
        #bpCategorySelect,
        #bpSearch {
            border: 1px solid var(--inv-border);
            font-weight: 500;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #bpCategorySelect {
            cursor: pointer;
        }
        #bpCategorySelect:hover,
        #bpSearch:hover {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(237, 28, 36, 0.1);
        }
        #bpCategorySelect:focus,
        #bpSearch:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(237, 28, 36, 0.1);
            outline: none;
        }
        .bp-grid-wrap {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 96px;
        }
        .bp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
            padding-bottom: 8px;
        }
        @media (max-width: 600px) {
            .bp-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }
        .bp-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            border: 2px solid #e8ece9;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }
        .bp-card:hover {
            border-color: var(--brand);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .bp-card.oos { opacity: 0.58; }
        .bp-img-wrap {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #f0f4f2, #e8f0ec);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid #e8ece9;
        }
        .bp-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .bp-img-ph { font-size: 3rem; color: #c5ccc8; }
        .bp-stock {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
        }
        .bp-stock.ok { background: rgba(237,28,36,0.12); color: var(--brand); }
        .bp-stock.low { background: rgba(255,152,0,0.18); color: #c2410c; }
        .bp-stock.bad { background: rgba(220,53,69,0.12); color: #c82333; }
        .bp-card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
        .bp-name {
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.35;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .bp-bc { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; }
        .bp-price { font-size: 1.1rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
        .bp-add {
            margin-top: auto;
            width: 100%;
            border: none;
            border-radius: var(--radius-sm);
            padding: 12px;
            font-weight: 700;
            font-size: 0.88rem;
            background: linear-gradient(135deg, var(--brand), var(--brand-light));
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
        }
        .bp-add:hover:not(:disabled) {
            filter: brightness(1.05);
            box-shadow: 0 4px 14px rgba(237,28,36,0.35);
        }
        .bp-add:disabled { background: #dee2e6; color: #999; cursor: not-allowed; }
        .bp-add.added { background: linear-gradient(135deg, #28a745, #218838); }
        .bp-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 20px;
            color: var(--muted);
        }
        .bp-empty i { font-size: 3rem; opacity: 0.35; display: block; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .bp-spin { animation: spin 0.9s linear infinite; display: inline-block; }
        .bp-dock {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 200;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e5e7eb;
            padding: 12px clamp(12px, 2vw, 28px) calc(12px + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
        }
        .bp-dock-inner {
            width: 100%;
            max-width: none;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .bp-dock-meta { flex: 1; min-width: 140px; font-size: 0.92rem; color: #444; }
        .bp-dock-meta strong { color: var(--accent); }
        .bp-btn-checkout {
            padding: 12px 22px;
            font-weight: 700;
            border-radius: var(--radius-sm);
            border: none;
            background: linear-gradient(135deg, var(--brand), var(--brand-light));
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(237,28,36,0.3);
        }
        .bp-btn-checkout:hover { color: #fff; filter: brightness(1.06); }
        #bpToast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-12px);
            z-index: 300;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
        }
        #bpToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #bpToast.ok { background: #198754; color: #fff; }
        #bpToast.warn { background: #ffc107; color: #1a1a1a; }
        #bpToast.err { background: #dc3545; color: #fff; }
    </style>
</head>
<body>
    <header class="bp-topbar">
        <div class="bp-topbar-inner">
            <a class="bp-back" href="{% url 'kiosk_home' %}">
                <i class="bi bi-arrow-left"></i> Back to checkout
            </a>
            <div class="bp-title-block">
                <h1><i class="bi bi-shop-window me-2"></i>Store catalog</h1>
                <p>Tap a product to add it — same cart as checkout</p>
            </div>
            <span class="bp-member-pill" id="bpMemberPill" style="display:none;"></span>
        </div>
    </header>

    <main class="bp-main">
        <div class="bp-toolbar">
            <h5 class="bp-inv-title">All Products</h5>
            <div class="d-flex align-items-center flex-wrap bp-inv-row">
                <div class="position-relative bp-inv-filter-wrap">
                    <i class="bi bi-funnel position-absolute bp-inv-icon-left text-muted" aria-hidden="true"></i>
                    <label for="bpCategorySelect" class="visually-hidden">Category</label>
                    <select id="bpCategorySelect" class="form-select rounded-pill ps-5" autocomplete="off">
                        <option value="">All Products</option>
                    </select>
                </div>
                <div class="position-relative bp-inv-search-wrap flex-grow-1">
                    <i class="bi bi-search position-absolute bp-inv-icon-left text-muted" aria-hidden="true"></i>
                    <label for="bpSearch" class="visually-hidden">Search products</label>
                    <input type="search" id="bpSearch" class="form-control rounded-pill ps-5" placeholder="Search products by name, barcode, category, or description…" autocomplete="off">
                </div>
                <button type="button" id="bpSearchBtn" class="btn btn-success rounded-pill px-3 px-sm-4 flex-shrink-0">
                    <i class="bi bi-search me-1"></i>Search
                </button>
            </div>
        </div>

        <div class="bp-grid-wrap">
            <div class="bp-grid" id="bpGrid">
                <div class="bp-empty">
                    <i class="bi bi-arrow-repeat bp-spin"></i>
                    <p class="mb-0">Loading products…</p>
                </div>
            </div>
        </div>
    </main>

    <div class="bp-dock">
        <div class="bp-dock-inner">
            <div class="bp-dock-meta">
                <span id="bpDockLine">Cart is empty</span>
            </div>
            <a class="bp-btn-checkout" href="{% url 'kiosk_home' %}">
                <i class="bi bi-bag-check-fill"></i> Return to checkout
            </a>
        </div>
    </div>

    <div id="bpToast" role="status"></div>

    {% include "partials/bootstrap_scripts.html" %}
    <script>
    const KIOSK_CART_KEY = 'coopKioskCart';
    const KIOSK_MEMBER_KEY = 'currentMember';
    const loggedInMember = {{ logged_in_member_json|safe }};
    const kioskOperator = {{ kiosk_operator_json|safe }};
    const PRIVILEGED_KIOSK_ROLES = ['admin', 'cashier', 'staff'];

    function isPrivilegedKioskRole(role) {
        return PRIVILEGED_KIOSK_ROLES.indexOf(String(role || '').toLowerCase()) !== -1;
    }

    function isPrivilegedKioskOperator() {
        if (kioskOperator && kioskOperator.is_privileged) return true;
        if (loggedInMember && isPrivilegedKioskRole(loggedInMember.role)) return true;
        return false;
    }

    function loadStoredKioskMember() {
        try {
            var stored = kioskStorageGet(KIOSK_MEMBER_KEY);
            if (stored) return JSON.parse(stored);
        } catch (e) {}
        return null;
    }

    function isKioskOperatorMember(member) {
        if (!member) return false;
        if (loggedInMember && loggedInMember.id != null && String(member.id) === String(loggedInMember.id)) return true;
        if (kioskOperator && kioskOperator.member_id != null && String(member.id) === String(kioskOperator.member_id)) return true;
        return isPrivilegedKioskRole(member.role);
    }

    function getAttachedCheckoutCustomer() {
        var stored = loadStoredKioskMember();
        if (stored && !isKioskOperatorMember(stored)) return stored;
        return null;
    }

    function getRestoredCheckoutMember() {
        var attached = getAttachedCheckoutCustomer();
        if (isPrivilegedKioskOperator()) return attached;
        if (loggedInMember) return loggedInMember;
        return attached || loadStoredKioskMember();
    }

    function kioskStorageGet(key) {
        try {
            var v = localStorage.getItem(key);
            if (v === null || v === '') {
                v = sessionStorage.getItem(key);
                if (v !== null && v !== '') {
                    try {
                        localStorage.setItem(key, v);
                        sessionStorage.removeItem(key);
                    } catch (e2) {}
                }
            }
            return v;
        } catch (e) {
            return null;
        }
    }
    function kioskStorageSet(key, value) {
        try {
            if (value === null || value === '') {
                localStorage.removeItem(key);
                sessionStorage.removeItem(key);
            } else {
                localStorage.setItem(key, value);
                sessionStorage.removeItem(key);
            }
        } catch (e) {}
    }
    function kioskStorageRemove(key) {
        try {
            localStorage.removeItem(key);
            sessionStorage.removeItem(key);
        } catch (e) {}
    }

    let currentMember = null;
    let cart = [];
    let allProducts = [];
    let categories = [];
    let activeCat = '';
    let searchTimer = null;
    function escapeHtml(s) {
        return (s + '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    function formatPriceCell(p) {
        const sale = parseFloat(p.price || 0);
        const reg = parseFloat(p.regular_price != null ? p.regular_price : p.price);
        const fmt = (n) => n.toFixed(2);
        if (!isNaN(reg) && reg > sale + 0.0001) {
            return '<span style="text-decoration:line-through;color:#888;font-size:0.85rem;">₱' + fmt(reg) + '</span> <strong style="color:#198754;">₱' + fmt(sale) + '</strong>';
        }
        return '₱' + fmt(sale);
    }

    function toast(msg, kind) {
        const el = document.getElementById('bpToast');
        if (!el) return;
        el.textContent = msg;
        el.className = kind === 'ok' ? 'ok' : (kind === 'warn' ? 'warn' : 'err');
        el.classList.add('show');
        clearTimeout(window._bpToastT);
        window._bpToastT = setTimeout(function() { el.classList.remove('show'); }, 2600);
    }

    function initMember() {
        currentMember = getRestoredCheckoutMember();
        renderMemberPill();
    }

    function renderMemberPill() {
        const pill = document.getElementById('bpMemberPill');
        if (!pill) return;
        const attached = currentMember && !isKioskOperatorMember(currentMember) ? currentMember : null;
        if (!attached || !attached.name) {
            pill.style.display = 'none';
            pill.innerHTML = '';
            return;
        }
        pill.style.display = 'inline-flex';
        pill.innerHTML =
            '<i class="bi bi-person-check"></i>' +
            '<span>' + escapeHtml(attached.name) + '</span>' +
            '<button type="button" class="bp-member-remove" onclick="removeBrowseMember()" aria-label="Remove customer"><i class="bi bi-x"></i></button>';
    }

    function removeBrowseMember() {
        if (!currentMember || isKioskOperatorMember(currentMember)) return;
        currentMember = null;
        kioskStorageRemove(KIOSK_MEMBER_KEY);
        renderMemberPill();
        loadProducts();
    }

    function loadCart() {
        try {
            var craw = kioskStorageGet(KIOSK_CART_KEY);
            if (craw) {
                var parsed = JSON.parse(craw);
                if (Array.isArray(parsed)) cart = parsed;
            }
        } catch (e) { cart = []; }
    }

    function saveCart() {
        try {
            if (cart.length) kioskStorageSet(KIOSK_CART_KEY, JSON.stringify(cart));
            else kioskStorageRemove(KIOSK_CART_KEY);
        } catch (e) {}
    }

    function cartQtyFor(id) {
        const row = cart.find(function(c) { return c.id === id; });
        return row ? row.quantity : 0;
    }

    function updateDock() {
        const el = document.getElementById('bpDockLine');
        if (!el) return;
        if (!cart.length) {
            el.innerHTML = 'Cart is empty';
            return;
        }
        var n = 0;
        for (var i = 0; i < cart.length; i++) n += cart[i].quantity;
        el.innerHTML = '<strong>' + n + '</strong> item' + (n === 1 ? '' : 's') + ' in cart · ' + cart.length + ' product' + (cart.length === 1 ? '' : 's');
    }

    function addToCart(p) {
        if (p.is_out_of_stock) {
            toast('Out of stock', 'warn');
            return;
        }
        var available = parseInt(p.stock || p.stock_quantity || 0, 10);
        var existing = cart.find(function(item) { return item.id === p.id; });
        if (existing) {
            if (existing.quantity + 1 > available) {
                toast('No more stock for this product', 'warn');
                return;
            }
            existing.quantity++;
            toast(existing.name + ' — qty ' + existing.quantity, 'ok');
        } else {
            if (available <= 0) {
                toast('Out of stock', 'warn');
                return;
            }
            cart.push({
                id: p.id,
                name: p.name,
                barcode: p.barcode,
                price: p.price,
                stock: p.stock,
                stock_quantity: p.stock,
                image: p.image,
                quantity: 1,
                available_stock: available,
                minus_price: 0
            });
            toast(p.name + ' added', 'ok');
        }
        saveCart();
        updateDock();
        renderGrid();
    }

    function catalogHaystack(p) {
        return ((p.name || '') + ' ' + (p.barcode || '') + ' ' + (p.category_name || '')).toLowerCase();
    }
    function matchesSearch(hay, raw) {
        var q = (raw || '').trim().toLowerCase().replace(/\s+/g, ' ');
        if (!q) return true;
        var tokens = q.split(' ').filter(Boolean);
        return tokens.every(function(t) { return hay.indexOf(t) >= 0; });
    }

    function filteredList(opts) {
        opts = opts || {};
        var raw = (document.getElementById('bpSearch') || {}).value || '';
        var list = allProducts;
        if (activeCat !== '') {
            list = list.filter(function(p) { return String(p.category_id) === String(activeCat); });
        }
        if (raw.trim().length >= 1) {
            list = list.filter(function(p) { return matchesSearch(catalogHaystack(p), raw); });
        }
        return list;
    }

    function populateCategorySelect() {
        var sel = document.getElementById('bpCategorySelect');
        if (!sel) return;
        var prev = activeCat;
        sel.innerHTML = '<option value="">All Products</option>';
        categories.forEach(function(cat) {
            var opt = document.createElement('option');
            opt.value = String(cat.id);
            opt.textContent = cat.name || ('Category ' + cat.id);
            sel.appendChild(opt);
        });
        sel.value = prev === '' || prev == null ? '' : String(prev);
        if (sel.value !== String(prev) && prev !== '' && prev != null) {
            activeCat = '';
            sel.value = '';
        }
    }

    function renderGrid() {
        var grid = document.getElementById('bpGrid');
        if (!grid) return;
        var list = filteredList();
        if (!list.length) {
            grid.innerHTML = '<div class="bp-empty"><i class="bi bi-search"></i><p class="mb-0">No products match your filters.</p></div>';
            return;
        }
        grid.innerHTML = list.map(function(p) {
            var qty = cartQtyFor(p.id);
            var badge = p.is_out_of_stock
                ? '<span class="bp-stock bad">Out of stock</span>'
                : p.is_low_stock
                    ? '<span class="bp-stock low">Low: ' + p.stock + '</span>'
                    : '<span class="bp-stock ok">Stock ' + p.stock + '</span>';
            var img = p.image
                ? '<img src="' + escapeHtml(p.image) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
                    + '<span class="bp-img-ph" style="display:none;"><i class="bi bi-box-seam"></i></span>'
                : '<span class="bp-img-ph"><i class="bi bi-box-seam"></i></span>';
            var btnLabel = p.is_out_of_stock
                ? '<i class="bi bi-x-circle"></i> Unavailable'
                : qty > 0
                    ? '<i class="bi bi-cart-check-fill"></i> In cart (' + qty + ')'
                    : '<i class="bi bi-cart-plus"></i> Add';
            var btnCls = 'bp-add' + (qty > 0 ? ' added' : '');
            var cardCls = 'bp-card' + (p.is_out_of_stock ? ' oos' : '');
            return '<article class="' + cardCls + '" data-id="' + p.id + '">' +
                '<div class="bp-img-wrap">' + img + badge + '</div>' +
                '<div class="bp-card-body">' +
                '<div class="bp-name" title="' + escapeHtml(p.name) + '">' + escapeHtml(p.name) + '</div>' +
                '<div class="bp-bc">' + escapeHtml(p.barcode || '') + '</div>' +
                '<div class="bp-price">' + formatPriceCell(p) + '</div>' +
                '<button type="button" class="' + btnCls + '" data-add-id="' + p.id + '"' + (p.is_out_of_stock ? ' disabled' : '') + '>' + btnLabel + '</button>' +
                '</div></article>';
        }).join('');

        grid.querySelectorAll('[data-add-id]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var id = parseInt(this.getAttribute('data-add-id'), 10);
                var prod = allProducts.find(function(x) { return x.id === id; });
                if (prod) addToCart(prod);
            });
        });
    }

    async function loadProducts() {
        var grid = document.getElementById('bpGrid');
        try {
            var url = '/api/products/';
            var attached = getAttachedCheckoutCustomer();
            if (!attached && currentMember && !isKioskOperatorMember(currentMember)) {
                attached = currentMember;
            }
            if (attached && attached.id != null) {
                url += '?member_id=' + encodeURIComponent(String(attached.id));
            }
            var res = await fetch(url);
            if (!res.ok) throw new Error('bad');
            var data = await res.json();
            allProducts = data.products || [];
            categories = data.categories || [];
            populateCategorySelect();
            renderGrid();
        } catch (e) {
            if (grid) {
                grid.innerHTML = '<div class="bp-empty"><i class="bi bi-exclamation-circle"></i><p>Could not load products. Check your connection and try again.</p></div>';
            }
        }
    }

    var bpSearchEl = document.getElementById('bpSearch');
    if (bpSearchEl) {
        bpSearchEl.addEventListener('input', function() {
            if (searchTimer) clearTimeout(searchTimer);
            searchTimer = setTimeout(renderGrid, 200);
        });
        bpSearchEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (searchTimer) clearTimeout(searchTimer);
                renderGrid();
            }
        });
    }
    var bpCatSel = document.getElementById('bpCategorySelect');
    if (bpCatSel) {
        bpCatSel.addEventListener('change', function() {
            activeCat = this.value || '';
            renderGrid();
        });
    }
    var bpSearchBtn = document.getElementById('bpSearchBtn');
    if (bpSearchBtn) {
        bpSearchBtn.addEventListener('click', function() {
            if (searchTimer) clearTimeout(searchTimer);
            renderGrid();
        });
    }
    (function idleLogout() {
        var AUTO = {{ kiosk_session_config.auto_logout_enabled|yesno:"true,false" }};
        var SKIP = {{ kiosk_skip_idle_logout|yesno:"true,false" }};
        var TIMEOUT = {{ kiosk_idle_timeout_ms }};
        var WARN = {{ kiosk_idle_warning_ms }};
        var LOGOUT = '{% url "kiosk_logout" %}';
        if (!AUTO || TIMEOUT <= 0 || SKIP) return;
        var t1, t2;
        function clear() {
            if (t1) clearTimeout(t1);
            if (t2) clearTimeout(t2);
            t1 = t2 = null;
        }
        function reset() {
            clear();
            var wd = Math.max(0, TIMEOUT - WARN);
            var wms = Math.min(WARN, TIMEOUT);
            t1 = setTimeout(function() {
                var sec = Math.ceil(wms / 1000);
                toast('Logging out in ' + sec + 's (inactive)', 'warn');
            }, wd);
            t2 = setTimeout(function() { window.location.href = LOGOUT; }, TIMEOUT);
        }
        ['mousedown','mousemove','keypress','scroll','touchstart','click','input'].forEach(function(ev) {
            document.addEventListener(ev, reset, true);
        });
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) reset();
        });
        reset();
    })();

    document.addEventListener('DOMContentLoaded', function() {
        initMember();
        loadCart();
        updateDock();
        loadProducts();
    });
    </script>
</body>
</html>
