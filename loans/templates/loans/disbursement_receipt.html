<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disbursement Voucher {{ disbursement.voucher_number }} | Loan #{{ application.id }}</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --brand: #ED1C24;
      --ok: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: #e2e8f0;
    }
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; gap: .6rem; flex-wrap: wrap; align-items: center;
      justify-content: space-between;
      padding: .75rem 1rem;
      background: #0f172a; color: #fff;
    }
    .toolbar a, .toolbar button {
      appearance: none; border: 0; cursor: pointer;
      border-radius: 999px; padding: .45rem .95rem;
      font-weight: 700; font-size: .86rem; text-decoration: none;
    }
    .toolbar .btn-print { background: #ED1C24; color: #fff; }
    .toolbar .btn-back { background: #334155; color: #fff; }
    .sheet-wrap { padding: 1.25rem; }
    .or-sheet {
      width: min(720px, 100%);
      margin: 0 auto 1.25rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.5rem 1.6rem 1.35rem;
      box-shadow: 0 10px 30px rgba(15,23,42,.08);
    }
    .or-head {
      display: flex; justify-content: space-between; gap: 1rem;
      align-items: flex-start; border-bottom: 2px solid var(--ink);
      padding-bottom: .85rem; margin-bottom: 1rem;
    }
    .or-brand h1 { margin: 0; font-size: 1.15rem; letter-spacing: .02em; }
    .or-brand p { margin: .2rem 0 0; color: var(--muted); font-size: .82rem; line-height: 1.4; }
    .or-badge { text-align: right; min-width: 170px; }
    .or-badge .label {
      font-size: .72rem; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; color: var(--brand);
    }
    .or-badge .or-no {
      font-size: 1.05rem; font-weight: 800; margin-top: .15rem;
      font-family: ui-monospace, Consolas, monospace;
    }
    .or-badge .copy {
      display: inline-block; margin-top: .35rem;
      border: 1px solid var(--line); border-radius: 999px;
      padding: .15rem .55rem; font-size: .72rem; font-weight: 700;
      color: var(--muted);
    }
    .or-title {
      text-align: center; font-weight: 800; font-size: 1.05rem;
      letter-spacing: .08em; text-transform: uppercase;
      margin: 0 0 1rem;
    }
    .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: .65rem 1.25rem;
      margin-bottom: 1rem;
    }
    .meta-grid dt {
      margin: 0; color: var(--muted); font-size: .72rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    }
    .meta-grid dd { margin: .1rem 0 0; font-weight: 700; font-size: .92rem; }
    {% include "admin_panel/partials/receipt_or_logo_styles.html" %}
    .breakdown {
      width: 100%; border-collapse: collapse; margin: 1rem 0;
      font-size: .92rem;
    }
    .breakdown th, .breakdown td {
      border-bottom: 1px solid var(--line);
      padding: .55rem .35rem;
      text-align: left;
    }
    .breakdown__amount { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .breakdown__deduction td { color: #b45309; }
    .breakdown__total td { border-top: 2px solid var(--ink); border-bottom: 0; padding-top: .75rem; }
    .amount-box {
      border: 2px solid var(--ink); border-radius: 10px;
      padding: .9rem 1rem; margin: 1rem 0;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    }
    .amount-box .lbl { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .amount-box .val { font-size: 1.45rem; font-weight: 800; color: var(--ok); }
    .notes {
      border-top: 1px dashed var(--line); padding-top: .85rem; margin-top: .85rem;
      color: var(--muted); font-size: .82rem; line-height: 1.45;
    }
    .sign-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
      margin-top: 1.75rem;
    }
    .sign-box { text-align: center; }
    .sign-line {
      border-top: 1px solid var(--ink); margin: 2.2rem 0 .35rem; padding-top: .35rem;
      font-size: .82rem; font-weight: 700;
    }
    .sign-sub { color: var(--muted); font-size: .74rem; }
    .security {
      margin-top: 1.1rem; font-size: .72rem; color: var(--muted);
      text-align: center; line-height: 1.4;
    }
    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .sheet-wrap { padding: 0; }
      .or-sheet {
        box-shadow: none; border: 0; border-radius: 0;
        width: 100%; margin: 0; padding: 0 0 12mm;
      }
    }
    @media (max-width: 640px) {
      .meta-grid, .sign-row, .or-head { grid-template-columns: 1fr; display: grid; }
      .or-badge { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <strong>Disbursement Voucher</strong> — {{ disbursement.voucher_number }}
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button type="button" class="btn-print" onclick="window.print()">Print / Save PDF</button>
      <a class="btn-back" href="{% url 'loans:application-detail' application.pk %}">Back to application</a>
    </div>
  </div>

  <div class="sheet-wrap">
    {% include "loans/partials/disbursement_voucher_sheet.html" %}
  </div>
</body>
</html>
